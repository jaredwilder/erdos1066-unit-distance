name: Erdos 1066 Replay

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.27.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version

      - name: Resolve pinned FormalConjectures
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build pinned FormalConjectures support libraries
        run: |
          cd .lake/packages/formal_conjectures
          lake build FormalConjecturesUtil FormalConjecturesForMathlib

      - name: Compile full module
        run: lake env lean formalization/Erdos1066.lean

      - name: Build axiom audit source
        run: |
          cp formalization/Erdos1066.lean /tmp/Erdos1066Audit.lean
          python -c 'p="/tmp/Erdos1066Audit.lean"; names=["indepCards_bddAbove","zero_mem_indepCards","card_le_alpha","alpha_le_card","exists_indep_card_eq_alpha","g_le_alpha","exists_indep_g","card_le_three_mul_alpha_of_threeColouring","threeColouring_cannot_beat_pach_toth","dist_pt_sq","dist_latticePoint_sq","triangularLattice_colouring_proper","latticeColouring_proper","one_le_latticeNorm","latticePoint_admissible","unit_triangle","unit_triangle_circumradius_sq"]; open(p,"a",encoding="utf-8").write("\n"+"\n".join("#print axioms Erdos1066."+n for n in names)+"\n")'

      - name: Audit 17 proved theorems
        run: |
          lake env lean /tmp/Erdos1066Audit.lean 2>&1 | tee /tmp/axioms.txt
          if grep -q sorryAx /tmp/axioms.txt; then
            echo "FAIL: advertised proved theorem depends on sorryAx" >&2
            exit 1
          fi
          grep "depends on axioms" /tmp/axioms.txt
          echo "PASS: no advertised proved theorem depends on sorryAx"

      - name: Audit local escape surface
        run: |
          python -c 'import re,pathlib; t=pathlib.Path("formalization/Erdos1066.lean").read_text(); assert not re.search(r"^\s*axiom\s+",t,re.M); assert not re.search(r"^\s*unsafe\s+",t,re.M); print("PASS: no local axiom or unsafe declaration")'
